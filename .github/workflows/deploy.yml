name: CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/teamchatsa-web
  IMAGE_TAG: ${{ github.sha }}
  COMPOSE_PROJECT_NAME: teamchatsa-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
            VITE_KAKAO_CLIENT_ID=${{ secrets.VITE_KAKAO_CLIENT_ID }}
            VITE_KAKAO_MAP_API_KEY=${{ secrets.VITE_KAKAO_MAP_API_KEY }}

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          source: docker-compose.prod.yml
          target: /opt/teamchatsa-web

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            mkdir -p /opt/teamchatsa-web
            cd /opt/teamchatsa-web
            export DOCKER_IMAGE='${{ env.DOCKER_IMAGE }}'
            export IMAGE_TAG='${{ env.IMAGE_TAG }}'
            export COMPOSE_PROJECT_NAME='${{ env.COMPOSE_PROJECT_NAME }}'
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml pull
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
