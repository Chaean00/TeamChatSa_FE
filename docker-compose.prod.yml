services:
  web:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: teamchatsa-web
    ports:
      - "${WEB_PORT}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM}
    restart: unless-stopped
    networks:
      - teamchatsa_default

networks:
  teamchatsa_default:
    external: true